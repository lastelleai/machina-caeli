[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "machina-caeli"
version = "0.0.1"
description = "Sky positions, gear trains and (later) voice, vision and motor control for Machina Caeli"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["machina_caeli*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
