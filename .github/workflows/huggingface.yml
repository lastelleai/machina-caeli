# Publishes the repository to huggingface.co/lastelleai/machina-caeli on every push to main.
# Needs the repository secret HF_TOKEN (a Hugging Face write token for the lastelleai account).
name: huggingface

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Upload to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "${HF_TOKEN}" ]; then
            echo "::error::Repository secret HF_TOKEN is not set."
            exit 1
          fi
          pip install --quiet "huggingface_hub>=0.26"
          python - <<'PY'
          import os
          from huggingface_hub import HfApi
          api = HfApi(token=os.environ["HF_TOKEN"])
          repo = "lastelleai/machina-caeli"
          api.create_repo(repo, repo_type="model", exist_ok=True)
          api.upload_folder(
              repo_id=repo,
              repo_type="model",
              folder_path=".",
              commit_message=f"Sync from GitHub {os.environ['GITHUB_SHA'][:7]}",
              ignore_patterns=[".git/*", ".github/*"],
              delete_patterns=["*"],
          )
          print(f"Published https://huggingface.co/{repo}")
          PY
